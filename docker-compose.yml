# No `version:` key — it's obsolete and Compose prints a warning if you add it.
name: trading-platform # prefix for container/volume names (else: the folder name)

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped # come back after Docker restarts, unless you stopped it
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432" # only listen on localhost, not on the network
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"] # dev mode: HTTP, built-in database
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true" # /health/ready on the management port 9000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl, so speak HTTP through bash's /dev/tcp
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
