# No `version:` key — it's obsolete and Compose prints a warning if you add it.
name: trading-platform # prefix for container/volume names (else: the folder name)

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped # come back after Docker restarts, unless you stopped it
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432" # only listen on localhost, not on the network
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
