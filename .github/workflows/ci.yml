name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # this workflow only reads the code

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # A throwaway Postgres just for this run, like the one in docker-compose.yml
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # No .env in CI. Tests add "_test" to this name, so they use the trading_test database above
      DATABASE_URL: postgresql+psycopg://trading:ci-only-password@localhost:5432/trading
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- run
